# coturn configuration for Funnel.
#
# This server does two jobs:
#   STUN — tells a peer what its public address looks like from outside.
#   TURN — relays SRTP when the two peers cannot reach each other directly
#          (symmetric NAT, or a phone on carrier CGNAT).
#
# Mounted read-only into the container at /etc/coturn/turnserver.conf.
# The relay is the only part of Funnel that ever touches media, and only as a
# fallback — everything else stays peer-to-peer.

# ---------------------------------------------------------------------------
# Listening
# ---------------------------------------------------------------------------

# 3478 is the IANA STUN/TURN port, plain UDP and TCP.
listening-port=3478

# TLS/DTLS listener. 5349 is the standard TURNS port. Commented out until
# certificates exist — coturn refuses to start with tls-listening-port set but
# no usable cert/key pair. See "Production notes" in ../README.md.
#tls-listening-port=5349
#cert=/etc/coturn/certs/fullchain.pem
#pkey=/etc/coturn/certs/privkey.pem

# Restrict to the transports we actually use. Uncomment to bind a single
# interface instead of every address on the host.
#listening-ip=0.0.0.0

# ---------------------------------------------------------------------------
# external-ip — the single most common misconfiguration
# ---------------------------------------------------------------------------
#
# coturn puts the address it thinks it owns into the relay candidates it hands
# out. If it is behind NAT (a cloud VM with a private NIC and a separate
# elastic/floating IP, a home router, a container with bridged networking) it
# sees only the private address and advertises that. Remote peers then try to
# reach 10.x / 172.x / 192.168.x, no packets arrive, and ICE quietly falls back
# to failing — with no error that points here.
#
# Format: external-ip=<PUBLIC_IP>/<PRIVATE_IP_BOUND_LOCALLY>
# If the public IP is bound directly on the interface, just: external-ip=<IP>
#
# Symptom of getting this wrong: Trickle ICE shows srflx candidates but never a
# `relay` one. Replace the placeholder before using this outside localhost.
#external-ip=203.0.113.10/10.0.0.5

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------

# Long-term credential mechanism. WebRTC clients only speak this; short-term
# credentials are not usable from a browser.
lt-cred-mech

# The realm is part of the credential hash, so it must match on both sides.
# The server hands clients TURN_USERNAME / TURN_CREDENTIAL; those were created
# against THIS realm. Changing it invalidates every existing credential.
realm=funnel.local

# --- Option A: static user (development only) ------------------------------
# Plaintext user:password. Fine for a laptop, wrong for anything reachable:
# the credential is in this file, never rotates, and is handed to every client.
# Must match TURN_USERNAME / TURN_CREDENTIAL in .env.
user=funnel:change-me-turn-password

# --- Option B: time-limited credentials (what production should use) -------
# With a shared secret, the signaling server mints a credential per session:
#   username  = <unix-expiry-timestamp>:<device-or-client-id>
#   credential = base64(hmac-sha1(secret, username))
# The credential expires on its own, so a leaked one is worthless within
# minutes and there is nothing to rotate by hand. Enable both lines together
# and drop the `user=` line above — coturn will not use a static user and a
# secret for the same realm.
#use-auth-secret
#static-auth-secret=change-me-to-a-long-random-hex-string

# ---------------------------------------------------------------------------
# Relay port range
# ---------------------------------------------------------------------------
#
# Every relayed session allocates a UDP port out of this range. It must be open
# in the host firewall / cloud security group, or allocations succeed on the
# server and time out on the client. Keep in sync with TURN_MIN_PORT /
# TURN_MAX_PORT in .env — nothing enforces that automatically.
#
# 41 ports is plenty for local testing. Production wants a few thousand
# (coturn's own default is 49152-65535); size it at roughly 2 ports per
# concurrent relayed stream, with headroom for ports still in TIME_WAIT.
min-port=49160
max-port=49200

# ---------------------------------------------------------------------------
# Protocol hygiene
# ---------------------------------------------------------------------------

# Add a FINGERPRINT attribute to messages. WebRTC stacks expect it, and it lets
# STUN traffic be demultiplexed from RTP on a shared port.
fingerprint

# Cap per-session and total relay throughput (bytes/sec, 0 = unlimited).
# Worth setting once the relay is public so one client cannot saturate the box.
#user-quota=12
#total-quota=1200
#max-bps=1000000

# ---------------------------------------------------------------------------
# Abuse prevention
#
# An open TURN relay will forward packets to wherever a client asks. Left
# unrestricted it is a free port scanner and proxy pointed at your own internal
# network — this is routinely found and abused on the public internet.
# ---------------------------------------------------------------------------

# Refuse to relay to multicast addresses.
no-multicast-peers

# Refuse loopback relays (would otherwise reach services on the coturn host).
no-loopback-peers

# Deny relaying into private and reserved ranges. Comments stay on their own
# lines — coturn takes the rest of a directive line as part of the value.

# RFC1918 private. 172.16/12 is where Docker's own bridges live, so without
# this a relay on the same host can reach every other container.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Loopback and "this network" — services bound to localhost on the coturn host.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Link-local. This range contains the cloud instance metadata endpoint
# (169.254.169.254); an open relay reaching it is a credential leak.
denied-peer-ip=169.254.0.0-169.254.255.255

# CGNAT shared address space — carrier-internal, not ours to reach.
denied-peer-ip=100.64.0.0-100.127.255.255

# Documentation, benchmarking, protocol-assignment and reserved ranges.
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# IPv6 equivalents. The IPv4-mapped range matters most: ::ffff:10.0.0.1 would
# otherwise slip past every IPv4 rule above.
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---------------------------------------------------------------------------
# Operations
# ---------------------------------------------------------------------------

# Disable the telnet CLI. It listens on 5766 with a weak default password and
# is a straightforward remote-admin hole; nothing here needs it.
no-cli

# Funnel does not use TURN's TCP/TLS-to-peer or STUN-only modes beyond the
# above; leaving the defaults keeps UDP and TCP client transports enabled.

# Log to stdout so `docker compose logs coturn` shows allocations. Set by the
# --log-file=stdout flag in docker-compose.yml rather than here, so the same
# file works for a non-container install.

# Set to see per-allocation detail while debugging ICE. Noisy; off by default.
#verbose
