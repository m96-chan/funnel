name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: shared / server / dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: npm` — that needs a lockfile, and none is committed yet.

      # `npm install` rather than `npm ci` for the same reason. Swap it once a
      # package-lock.json lands, so builds stop drifting with upstream releases.
      - name: Install workspaces
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the command-line tools and accepts the SDK licences, so AGP can
      # fetch compileSdk 35 and the build-tools it needs.
      - uses: android-actions/setup-android@v3

      # The wrapper jar is deliberately not committed, so CI runs Gradle
      # directly at the version `gradle-wrapper.properties` pins.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assemble debug APK
        run: gradle --project-dir android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: funnel-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
